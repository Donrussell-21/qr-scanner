<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Attendance System</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <i class="bi bi-qr-code-scan logo"></i>

            <h1>QR Attendance System</h1>

            <p>
                Scan your Student QR Code
            </p>

        </div>

        <!-- QR Scanner -->
        <div id="reader"></div>

        <!-- Buttons -->
        <div class="buttons">

            <button id="startBtn" onclick="startScanner()">

                <i class="bi bi-camera-fill"></i>

                Start Scanner

            </button>

            <button id="stopBtn" onclick="stopScanner()">

                <i class="bi bi-stop-circle-fill"></i>

                Stop Scanner

            </button>

        </div>

        <!-- Status -->
        <div class="status-box">

            <span>Status :</span>

            <span id="status">
                Waiting to start scanner...
            </span>

        </div>

        <!-- Student Information -->
        <div id="resultCard" class="result-card" style="display:none;">

            <h2>

                <i class="bi bi-person-badge-fill"></i>

                Student Information

            </h2>

            <table>

                <tr>

                    <td>Student ID</td>

                    <td id="studentID">-</td>

                </tr>

                <tr>

                    <td>Name</td>

                    <td id="studentName">-</td>

                </tr>

                <tr>

                    <td>Track / Strand</td>

                    <td id="studentTrack">-</td>

                </tr>

                <tr>

                    <td>Grade / Section</td>

                    <td id="studentGrade">-</td>

                </tr>

                <tr>

                    <td>Attendance</td>

                    <td id="attendanceStatus">-</td>

                </tr>

                <tr>

                    <td>Scan Time</td>

                    <td id="scanTime">-</td>

                </tr>

            </table>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
