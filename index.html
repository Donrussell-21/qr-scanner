<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Attendance Scanner</title>


    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">


    <!-- QR Scanner Library -->
    <script 
        src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>


    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">


</head>


<body class="bg-light">


<div class="container mt-5">


    <!-- Header -->

    <div class="text-center mb-4">

        <h2>
            Olongtao National High School
        </h2>


        <h5>
            Senior High School
        </h5>


        <h4 class="text-success">
            QR Attendance Scanner
        </h4>

    </div>



    <!-- Scanner Card -->

    <div class="card shadow">


        <div class="card-header bg-success text-white">

            <h4 class="mb-0">
                QR Camera
            </h4>

        </div>



        <div class="card-body">


            <!-- Camera Display -->

            <div id="reader"></div>


            <br>


            <!-- Status -->

            <div 
                id="status" 
                class="alert alert-info text-center">

                Click START SCANNER

            </div>



            <!-- Buttons -->

            <div class="text-center">


                <button 
                    class="btn btn-success me-2"
                    onclick="startScanner()">

                    Start Scanner

                </button>



                <button 
                    class="btn btn-danger"
                    onclick="stopScanner()">

                    Stop Scanner

                </button>


            </div>


        </div>


    </div>



    <br>



    <!-- Last Scan Result -->

    <div class="card shadow">


        <div class="card-header bg-dark text-white">

            Last Scan

        </div>



        <div class="card-body">


            <table class="table">


                <tr>

                    <th width="150">
                        Student ID
                    </th>


                    <td id="studentID">
                        -
                    </td>

                </tr>



                <tr>

                    <th>
                        Name
                    </th>


                    <td id="studentName">
                        -
                    </td>

                </tr>



                <tr>

                    <th>
                        Status
                    </th>


                    <td id="attendanceStatus">
                        -
                    </td>

                </tr>



                <tr>

                    <th>
                        Date & Time
                    </th>


                    <td id="scanTime">
                        -
                    </td>

                </tr>



            </table>


        </div>


    </div>



</div>



<!-- JavaScript -->

<script src="script.js"></script>



</body>

</html>
